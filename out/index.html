<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarium - Online Waterproof Playground</title>
    <script src="index.js"></script>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="editor.css">
    <link rel="icon" type="image/png" href="favicon-32.png">
</head>
<body>
    <div id="container">
        <div id="editor"></div>
        <div id="goals-panel">
            <h2 id="title">Goals</h2>
            <div id="goals"></div>
            <div id="messages"></div>
            <div id="help"><h3>Help:</h3><button id="help-button">Help</button><div id="help-container"></div></div>
            
            <div id="exercise-toolbar">
                <span>Open A Different Exercise Sheet:</span>
                <select id="exercise-dropdown">
					<option value="">-- Select Sheet --</option>
					<option disabled>──────────</option>
					<option value="https://raw.githubusercontent.com/impermeable/analysis-rug/fix/rocq-9.0/tutorial.mv">Analysis RUG - Waterproof Tutorial</option>
					<option value="https://raw.githubusercontent.com/impermeable/analysis-rug/fix/rocq-9.0/exercises/hw1_infimum.mv">Analysis RUG - Homework 1: Infimum</option>
					<option value="https://raw.githubusercontent.com/impermeable/analysis-rug/fix/rocq-9.0/exercises/hw2_series_ratio.mv">Analysis RUG - Homework 2: Series Ratio</option>
					<option value="https://raw.githubusercontent.com/impermeable/analysis-rug/fix/rocq-9.0/exercises/hw3_limit_point.mv">Analysis RUG - Homework 3: Limit Point</option>
					<option value="https://raw.githubusercontent.com/impermeable/analysis-rug/fix/rocq-9.0/exercises/hw4_uniform_convergence.mv">Analysis RUG - Homework 4: Uniform Convergence</option>
				</select>
            </div>
        </div>
    </div>
</body>
</html>
